<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow">
    <title>Private Profile</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at center, #3a1c24 0%, #0a0a0a 100%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            overflow: hidden;
            padding: 20px;
        }

        .ios-banner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(90deg, #ff2a5f, #ff7e67);
            color: white;
            padding: 12px 15px;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            display: none;
            z-index: 999;
            box-shadow: 0 4px 15px rgba(255, 42, 95, 0.5);
            animation: pulse-banner 2s infinite;
        }

        .ios-banner span {
            text-decoration: underline;
            font-size: 15px;
        }

        .modal {
            background: rgba(30, 30, 30, 0.7);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 40px 25px;
            border-radius: 24px;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            position: relative;
            margin-top: 40px;
        }

        .avatar-container {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 0 auto 20px auto;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff2a5f, #ff7e67);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 0 20px rgba(255, 42, 95, 0.4);
        }

        .badge {
            position: absolute;
            top: 0;
            right: 0;
            background-color: #ff2a5f;
            color: white;
            font-size: 14px;
            font-weight: bold;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #222;
            animation: pulse-badge 2s infinite;
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        p {
            font-size: 15px;
            color: #cccccc;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 18px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.1s, filter 0.2s;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(90deg, #ff2a5f, #ff4b72);
            color: white;
            box-shadow: 0 8px 20px rgba(255, 42, 95, 0.4);
            animation: pulse-btn 2.5s infinite;
            border: none;
        }

        .btn-primary:active {
            transform: scale(0.96);
        }

        .btn-secondary {
            background: transparent;
            color: #888888;
            border: 1px solid #444;
        }

        .secure-note {
            margin-top: 25px;
            font-size: 12px;
            color: #777;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        @keyframes pulse-btn {
            0% { box-shadow: 0 0 0 0 rgba(255, 42, 95, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 42, 95, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 42, 95, 0); }
        }

        @keyframes pulse-badge {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        @keyframes pulse-banner {
            0% { opacity: 0.9; }
            50% { opacity: 1; filter: brightness(1.2); }
            100% { opacity: 0.9; }
        }
    </style>
</head>
<body>

    <div id="iosBanner" class="ios-banner">
        🚨 ERROR: Tap <span>⋯</span> in top-right ➔ Select <b>"Open in external browser"</b> to watch!
    </div>

    <div class="modal">
        <div class="avatar-container">
            <div class="avatar">🤫</div>
            <div class="badge">1</div>
        </div>
        
        <h1 id="t-title">Private Content</h1>
        <p id="t-desc">This profile contains explicit 18+ content.<br>Please verify your age to enter.</p>
        
        <div class="btn-container">
            <button onclick="goToOffer(event)" id="t-yes" class="btn btn-primary">YES, I AM 18+ 💦</button>
            <a href="https://google.com" id="t-no" class="btn btn-secondary">No, I'm under 18</a>
        </div>

        <div id="t-secure" class="secure-note">
            🔒 100% Secure & Free Registration
        </div>
    </div>

    <script>
        // --- 1. СИСТЕМА ЛОКАЛИЗАЦИИ (АВТО-ПЕРЕВОД) ---
        const translations = {
            "es": {
                banner: "🚨 ERROR: Toca <span>⋯</span> arriba a la derecha ➔ Selecciona <b>'Abrir en el navegador'</b> para ver.",
                title: "Contenido Privado",
                desc: "Este perfil contiene contenido explícito +18.<br>Por favor, verifica tu edad para entrar.",
                btnYes: "SÍ, SOY +18 💦",
                btnNo: "No, soy menor de 18",
                secure: "🔒 Registro 100% Seguro y Gratuito"
            },
            "pt": {
                banner: "🚨 ERRO: Toque em <span>⋯</span> no canto superior direito ➔ Selecione <b>'Abrir no navegador'</b>!",
                title: "Conteúdo Privado",
                desc: "Este perfil contém conteúdo explícito +18.<br>Por favor, verifique sua idade para entrar.",
                btnYes: "SIM, TENHO +18 💦",
                btnNo: "Não, sou menor de 18",
                secure: "🔒 Registro 100% Seguro e Gratuito"
            },
            "fr": {
                banner: "🚨 ERREUR : Appuyez sur <span>⋯</span> en haut à droite ➔ Sélectionnez <b>'Ouvrir dans le navigateur'</b> !",
                title: "Contenu Privé",
                desc: "Ce profil contient du contenu explicite +18.<br>Veuillez vérifier votre âge pour entrer.",
                btnYes: "OUI, J'AI +18 ANS 💦",
                btnNo: "Non, j'ai moins de 18 ans",
                secure: "🔒 Inscription 100% Sécurisée et Gratuite"
            },
            "de": {
                banner: "🚨 FEHLER: Tippe auf <span>⋯</span> oben rechts ➔ Wähle <b>'Im Browser öffnen'</b> um das Video zu sehen!",
                title: "Privater Inhalt",
                desc: "Dieses Profil enthält explizite 18+ Inhalte.<br>Bitte bestätige dein Alter, um fortzufahren.",
                btnYes: "JA, ICH BIN 18+ 💦",
                btnNo: "Nein, ich bin unter 18",
                secure: "🔒 100% Sichere & Kostenlose Registrierung"
            },
            "it": {
                banner: "🚨 ERRORE: Tocca <span>⋯</span> in alto a destra ➔ Seleziona <b>'Apri nel browser'</b> per guardare!",
                title: "Contenuto Privato",
                desc: "Questo profilo contiene contenuti espliciti V.M. 18 anni.<br>Verifica la tua età per entrare.",
                btnYes: "SÌ, HO 18+ ANNI 💦",
                btnNo: "No, ho meno di 18 anni",
                secure: "🔒 Registrazione 100% Sicura e Gratuita"
            },
            "ru": {
                banner: "🚨 ОШИБКА: Нажмите <span>⋯</span> в правом верхнем углу ➔ Выберите <b>'Открыть в браузере'</b> для просмотра!",
                title: "Приватный контент",
                desc: "В этом профиле содержатся откровенные материалы 18+.<br>Пожалуйста, подтвердите свой возраст.",
                btnYes: "ДА, МНЕ ЕСТЬ 18 💦",
                btnNo: "Нет, мне меньше 18",
                secure: "🔒 100% Безопасная и бесплатная регистрация"
            }
        };

        const lang = (navigator.language || navigator.userLanguage).substr(0, 2).toLowerCase();
        
        if (translations[lang]) {
            document.getElementById('iosBanner').innerHTML = translations[lang].banner;
            document.getElementById('t-title').innerHTML = translations[lang].title;
            document.getElementById('t-desc').innerHTML = translations[lang].desc;
            document.getElementById('t-yes').innerHTML = translations[lang].btnYes;
            document.getElementById('t-no').innerHTML = translations[lang].btnNo;
            document.getElementById('t-secure').innerHTML = translations[lang].secure;
        }

        // --- 2. ЖЕСТКАЯ БЛОКИРОВКА ИНДИИ ЧЕРЕЗ CLOUDFLARE TRACE ---
        let targetUrl = "https://nord.affpmelody.com/Xyjn8l";
        let geoChecked = false;

        // Неблокируемый запрос к системному API Cloudflare
        fetch('https://1.1.1.1/cdn-cgi/trace')
            .then(res => res.text())
            .then(data => {
                let locLine = data.trim().split('\n').find(line => line.startsWith('loc='));
                if (locLine && locLine.split('=')[1] === 'IN') {
                    targetUrl = "https://google.com";
                }
                geoChecked = true;
            })
            .catch(() => {
                // Если Cloudflare недоступен, пробуем старый API
                fetch('https://get.geojs.io/v1/ip/country.json')
                    .then(res => res.json())
                    .then(data => {
                        if (data.country === 'IN') { targetUrl = "https://google.com"; }
                        geoChecked = true;
                    }).catch(() => { geoChecked = true; });
            });

        function isInAppBrowser() {
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            return (ua.indexOf('Instagram') > -1 || ua.indexOf('FBAN') > -1 || ua.indexOf('FBAV') > -1 || ua.indexOf('Twitter') > -1);
        }

        window.onload = function() {
            if (isInAppBrowser()) {
                document.getElementById('iosBanner').style.display = 'block';
            }
        };

        function goToOffer(e) {
            if (e) e.preventDefault();

            // Если человек кликнул слишком быстро (ГЕО еще не проверилось), ждем 100мс
            if (!geoChecked) {
                setTimeout(() => goToOffer(null), 100);
                return;
            }

            // Индия всегда улетает в гугл без исключений
            if (targetUrl === "https://google.com") {
                window.location.href = targetUrl;
                return;
            }

            const isAndroid = /android/i.test(navigator.userAgent);

            // Интент Chrome для Android
            if (isInAppBrowser() && isAndroid) {
                window.location.href = "intent://" + targetUrl.replace(/^https?:\/\//, '') + "#Intent;scheme=https;package=com.android.chrome;end;";
                setTimeout(function() {
                    window.location.href = targetUrl;
                }, 1000);
                return;
            }

            // Стандартный переход для остальных
            window.location.href = targetUrl;
        }
    </script>
</body>
</html>
