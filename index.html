<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow">
    <title>Private Profile Verification</title>
    <style>
        /* ==========================================
           ПРЕМИУМ ДИЗАЙН (GLASSMORPHISM + GLOW)
           ========================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            /* Глубокий темный фон с красно-розовым свечением */
            background: radial-gradient(circle at 50% 30%, #3a0d1c 0%, #050505 80%);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            overflow: hidden;
            padding: 20px;
        }

        /* Эффект матового стекла (Apple Style) */
        .glass-panel {
            background: rgba(20, 20, 20, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 40px 25px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.1);
            position: relative;
            transform: translateY(20px);
            animation: float-up 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
        }

        .icon-warning {
            font-size: 50px;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 15px rgba(255, 42, 95, 0.6));
            animation: pulse-icon 2s infinite;
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #ffffff, #ffb3c6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 15px;
            color: #b3b3b3;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* Анимированная подсказка для iOS */
        .ios-hint {
            display: none;
            background: rgba(255, 42, 95, 0.15);
            border: 1px solid rgba(255, 42, 95, 0.4);
            color: #ffdae0;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 15px;
            animation: pulse-border 2s infinite;
            transition: all 0.3s ease;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 18px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 800;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
            /* ВАЖНО: Разрешаем вызов нативного меню iOS при долгом нажатии */
            -webkit-touch-callout: default !important; 
            cursor: pointer;
        }

        .btn-glow {
            background: linear-gradient(135deg, #ff2a5f, #ff6b3d);
            color: white;
            border: none;
            box-shadow: 0 10px 25px rgba(255, 42, 95, 0.4);
            position: relative;
            overflow: hidden;
        }

        .btn-glow::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shine 3s infinite;
        }

        .btn-glow:active { transform: scale(0.96); box-shadow: 0 5px 15px rgba(255, 42, 95, 0.4); }

        .btn-ghost {
            background: transparent;
            color: #777;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .secure-badge {
            margin-top: 25px;
            font-size: 12px;
            color: #666;
            font-weight: 500;
        }

        /* Анимации */
        @keyframes float-up { to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse-icon { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        @keyframes pulse-border { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,42,95,0.4); } 50% { box-shadow: 0 0 0 8px rgba(255,42,95,0); } }
        @keyframes shine { 100% { left: 200%; } }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-8px); }
        }
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
    </style>
</head>
<body>

    <div class="glass-panel">
        <div class="icon-warning">🤫</div>
        <h1 id="txt-title">Age Verification</h1>
        <p id="txt-desc">This profile contains explicit 18+ content.<br>Please verify your age to enter.</p>

        <!-- Подсказка для iOS -->
        <div id="ios-hint" class="ios-hint">
            👇 HOLD button for 2 seconds & select 'Open Link'
        </div>

        <div class="btn-container">
            <a href="#" id="btn-yes" class="btn btn-glow">YES, I AM 18+ 💦</a>
            <a href="https://google.com" id="btn-no" class="btn btn-ghost">No, I'm under 18</a>
        </div>

        <div id="txt-secure" class="secure-badge">🔒 100% Secure & Free Registration</div>
    </div>

    <script>
        // ==========================================
        // 1. НАСТРОЙКИ ССЫЛОК И ГЕО-БЛОКИРОВКИ
        // ==========================================
        let targetUrl = "https://nord.affpmelody.com/Xyjn8l"; 
        const fallbackUrl = "https://google.com";
        
        // РАСШИРЕННЫЙ BLACKLIST: Индия, Филиппины, Таиланд, Турция, Сирия, Ирак, Индонезия
        const blockedGeos = ['IN', 'PH', 'TH', 'TR', 'SY', 'IQ', 'ID'];
        
        let isBadGeo = false;
        let geoChecked = false;

        // ==========================================
        // 2. СМАРТ-ЛОКАЛИЗАЦИЯ (АВТО-ПЕРЕВОД)
        // ==========================================
        const i18n = {
            "en": {
                title: "Age Verification",
                desc: "This profile contains explicit 18+ content.<br>Please verify your age to enter.",
                hint: "👇 HOLD button for 2 seconds & select 'Open Link'",
                hintError: "⚠️ Please HOLD the button, do not just tap!",
                yes: "YES, I AM 18+ 💦",
                no: "No, I'm under 18",
                secure: "🔒 100% Secure & Free Registration"
            },
            "es": {
                title: "Verificación de Edad",
                desc: "Este perfil contiene contenido explícito +18.<br>Por favor verifica tu edad.",
                hint: "👇 MANTÉN presionado el botón 2 seg. y elige 'Abrir enlace'",
                hintError: "⚠️ ¡MANTÉN presionado el botón, no solo lo toques!",
                yes: "SÍ, TENGO +18 💦",
                no: "No, soy menor de 18",
                secure: "🔒 Registro 100% Seguro y Gratuito"
            },
            "pt": {
                title: "Verificação de Idade",
                desc: "Este perfil contém conteúdo explícito +18.<br>Por favor, verifique sua idade.",
                hint: "👇 SEGURE o botão por 2 seg. e escolha 'Abrir link'",
                hintError: "⚠️ Por favor, SEGURE o botão, não apenas toque!",
                yes: "SIM, TENHO +18 💦",
                no: "Não, sou menor de 18",
                secure: "🔒 Registro 100% Seguro e Gratuito"
            },
            "fr": {
                title: "Vérification d'âge",
                desc: "Ce profil contient du contenu explicite +18.<br>Veuillez vérifier votre âge.",
                hint: "👇 MAINTENEZ le bouton 2 sec et choisissez 'Ouvrir le lien'",
                hintError: "⚠️ Veuillez MAINTENIR le bouton appuyé !",
                yes: "OUI, J'AI +18 ANS 💦",
                no: "Non, j'ai moins de 18 ans",
                secure: "🔒 Inscription 100% Sécurisée et Gratuite"
            },
            "de": {
                title: "Altersprüfung",
                desc: "Dieses Profil enthält explizite 18+ Inhalte.<br>Bitte bestätige dein Alter.",
                hint: "👇 HALTE den Button 2 Sek. und wähle 'Link öffnen'",
                hintError: "⚠️ Bitte HALTE den Button gedrückt!",
                yes: "JA, ICH BIN 18+ 💦",
                no: "Nein, ich bin unter 18",
                secure: "🔒 100% Sichere & Kostenlose Registrierung"
            },
            "it": {
                title: "Verifica dell'età",
                desc: "Questo profilo contiene contenuti espliciti V.M. 18 anni.<br>Verifica la tua età.",
                hint: "👇 TIENI PREMUTO per 2 sec. e scegli 'Apri link'",
                hintError: "⚠️ TIENI PREMUTO il pulsante, non toccarlo e basta!",
                yes: "SÌ, HO 18+ ANNI 💦",
                no: "No, ho meno di 18 anni",
                secure: "🔒 Registrazione 100% Sicura e Gratuita"
            },
            "ru": {
                title: "Подтверждение возраста",
                desc: "В этом профиле содержатся откровенные материалы 18+.<br>Подтвердите свой возраст.",
                hint: "👇 УДЕРЖИВАЙТЕ кнопку 2 секунды и выберите 'Открыть ссылку'",
                hintError: "⚠️ ЖМИТЕ И УДЕРЖИВАЙТЕ кнопку, а не просто кликайте!",
                yes: "ДА, МНЕ ЕСТЬ 18 💦",
                no: "Нет, мне меньше 18",
                secure: "🔒 100% Безопасная и бесплатная регистрация"
            }
        };

        // Определяем язык телефона (по умолчанию Английский)
        const userLang = (navigator.language || navigator.userLanguage).substr(0, 2).toLowerCase();
        const lang = i18n[userLang] ? userLang : "en";
        const texts = i18n[lang];

        // Применяем переводы
        document.getElementById('txt-title').innerHTML = texts.title;
        document.getElementById('txt-desc').innerHTML = texts.desc;
        document.getElementById('ios-hint').innerHTML = texts.hint;
        document.getElementById('btn-yes').innerHTML = texts.yes;
        document.getElementById('btn-no').innerHTML = texts.no;
        document.getElementById('txt-secure').innerHTML = texts.secure;

        // ==========================================
        // 3. ДЕТЕКТОР УСТРОЙСТВА И БРАУЗЕРА
        // ==========================================
        const ua = navigator.userAgent || navigator.vendor || window.opera;
        const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
        const isAndroid = /android/i.test(ua);
        const isInApp = (ua.indexOf('Instagram') > -1 || ua.indexOf('FBAN') > -1 || ua.indexOf('FBAV') > -1);

        const btnYes = document.getElementById('btn-yes');
        const iosHint = document.getElementById('ios-hint');

        // ==========================================
        // 4. ПРОВЕРКА ГЕО И АКТИВАЦИЯ КНОПОК
        // ==========================================
        function setupButtons() {
            let finalUrl = isBadGeo ? fallbackUrl : targetUrl;
            
            // Если iOS внутри Инсты - применяем хак с Long-Press
            if (isIOS && isInApp) {
                btnYes.href = finalUrl; // Обязательно ставим href, иначе нативное меню не появится
                iosHint.style.display = 'block'; // Показываем подсказку

                // Блокируем обычный быстрый клик и ругаемся
                btnYes.addEventListener('click', function(e) {
                    e.preventDefault(); 
                    iosHint.innerHTML = texts.hintError;
                    iosHint.style.color = '#ffffff';
                    iosHint.style.background = 'rgba(255, 0, 0, 0.4)';
                    iosHint.style.borderColor = '#ff3333';
                    
                    // Трясем подсказку для привлечения внимания
                    iosHint.classList.remove('shake');
                    void iosHint.offsetWidth; // Магия для перезапуска анимации
                    iosHint.classList.add('shake');
                    
                    setTimeout(() => {
                        iosHint.style.background = 'rgba(255, 42, 95, 0.15)';
                        iosHint.style.borderColor = 'rgba(255, 42, 95, 0.4)';
                        iosHint.innerHTML = texts.hint;
                    }, 2500);
                });
            } 
            // Если Android или обычный браузер
            else {
                btnYes.addEventListener('click', function(e) {
                    e.preventDefault();
                    if (isBadGeo) { window.location.href = fallbackUrl; return; }

                    // Android: жесткий Интент в Chrome
                    if (isAndroid && isInApp) {
                        let cleanUrl = targetUrl.replace(/^https?:\/\//, '');
                        let intentUrl = "intent://" + cleanUrl + "#Intent;scheme=https;package=com.android.chrome;end;";
                        window.location.href = intentUrl;
                        
                        // Если Интент заблокирован, через 1.5 сек откроет внутри WebView
                        setTimeout(() => { window.location.href = targetUrl; }, 1500);
                    } else {
                        // Для ПК и нормальных мобильных браузеров
                        window.location.href = targetUrl;
                    }
                });
            }
        }

        // Запрашиваем ГЕО у Cloudflare (быстро и бесплатно)
        fetch('https://1.1.1.1/cdn-cgi/trace')
            .then(res => res.text())
            .then(data => {
                let locLine = data.trim().split('\n').find(line => line.startsWith('loc='));
                if (locLine && blockedGeos.includes(locLine.split('=')[1])) {
                    isBadGeo = true;
                }
                geoChecked = true;
                setupButtons();
            })
            .catch(() => { 
                // Если Cloudflare заблочен, разрешаем переход
                geoChecked = true; 
                setupButtons(); 
            });

    </script>
</body>
</html>
